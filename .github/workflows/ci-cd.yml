name: OpsTracker CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: TEST (Quality Gate: Backend Integration + Playwright E2E)
  # ============================================================================
  test:
    name: Run Automated Tests (Backend + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Prepare local test environment
        run: |
          cp .env.example .env

      - name: Start test containers (Postgres, Backend, Frontend)
        run: |
          docker compose up -d --build postgres backend frontend
          echo "Waiting for backend healthcheck to become healthy..."
          timeout 90 bash -c 'until docker compose ps | grep -E "opstracker-backend.*healthy"; do sleep 2; done'
          docker compose ps
          curl -fail http://127.0.0.1:3001/api/health
          curl -fail http://127.0.0.1:8080/api/health

      - name: Install dependencies and Playwright browser
        run: |
          npm ci
          npm --prefix backend ci
          npx playwright install --with-deps chromium

      - name: Run Backend Integration Tests (Jest)
        run: |
          npm run test:backend

      - name: Run End-to-End Tests (Playwright)
        run: |
          npm run test:e2e

      - name: Upload Playwright Test Report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop test containers
        if: always()
        run: |
          docker compose down -v

      # ========================================================================
      # RF-03: Send test results to OpenObserve (/api/default/cicd_logs/_json)
      # Runs always (success or failure) to register pass or incident in OpenObserve
      # ========================================================================
      - name: Send Test Results Event to OpenObserve
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Posting test status '$STATUS' to OpenObserve cicd_logs stream..."
          PAYLOAD=$(jq -n \
            --arg event_type "test_execution" \
            --arg status "$STATUS" \
            --arg commit_sha "${{ github.sha }}" \
            --arg commit_message "${{ github.event.head_commit.message }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg repository "${{ github.repository }}" \
            --arg timestamp "$TIMESTAMP" \
            '[{
              timestamp: $timestamp,
              event_type: $event_type,
              status: $status,
              commit_sha: $commit_sha,
              commit_message: $commit_message,
              branch: $branch,
              actor: $actor,
              workflow: $workflow,
              run_id: $run_id,
              run_number: $run_number,
              repository: $repo
            }]')

          curl -s -S -X POST "${{ secrets.OPENOBSERVE_URL }}/api/default/cicd_logs/_json" \
            -u "${{ secrets.OPENOBSERVE_USER }}:${{ secrets.OPENOBSERVE_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: OpenObserve reporting failed but will not break pipeline"

  # ============================================================================
  # JOB 2: DEPLOY (Strict Gate: Needs Test + Success Only)
  # If 'test' fails, this job NEVER runs: SSH to EC2 remains completely closed!
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Deploy containers on AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "--> Pulling latest changes on EC2..."
            cd /home/ubuntu/opstracker
            git fetch origin main
            git reset --hard origin/main

            echo "--> Rebuilding and starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "--> Checking container status..."
            docker compose -f docker-compose.prod.yml ps

      # ========================================================================
      # RF-03: Send deployment event to OpenObserve (/api/default/cicd_logs/_json)
      # ========================================================================
      - name: Send Deployment Event to OpenObserve
        if: success()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg event_type "deployment" \
            --arg status "success" \
            --arg commit_sha "${{ github.sha }}" \
            --arg commit_message "${{ github.event.head_commit.message }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg target_host "${{ secrets.EC2_HOST }}" \
            --arg timestamp "$TIMESTAMP" \
            '[{
              timestamp: $timestamp,
              event_type: $event_type,
              status: $status,
              commit_sha: $commit_sha,
              commit_message: $commit_message,
              branch: $branch,
              actor: $actor,
              workflow: $workflow,
              target_host: $target_host
            }]')

          curl -s -S -X POST "${{ secrets.OPENOBSERVE_URL }}/api/default/cicd_logs/_json" \
            -u "${{ secrets.OPENOBSERVE_USER }}:${{ secrets.OPENOBSERVE_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: OpenObserve reporting failed"
